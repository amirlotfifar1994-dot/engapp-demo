  <style>
    .app-starting #app,.app-starting .skip-link{visibility:hidden}

    #app-startup{position:fixed;inset:0;z-index:100000;display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box;gap:0;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));overflow:auto;text-align:center;background:#fafcfb;color:#174b3e;font:16px/1.5 system-ui,sans-serif}
    #app-startup[hidden]{display:none}
    #app-startup .startup-art{display:block;width:min(390px,82vw,47svh);height:auto;aspect-ratio:1;object-fit:contain;animation:startup-float 4s ease-in-out infinite}
    #app-startup strong{margin-top:4px;font-size:clamp(32px,5vw,42px);font-weight:750;line-height:1.2;letter-spacing:-1.6px}
    #app-startup .startup-tagline{margin:8px 0 28px;font-size:15px;color:#577067;letter-spacing:.3px}
    #app-startup .startup-dots{display:flex;gap:7px;align-items:center;height:16px;margin-bottom:12px}
    #app-startup .startup-dots i{width:6px;height:6px;border-radius:50%;background:#246c53;animation:startup-pulse 1.4s ease-in-out infinite}
    #app-startup .startup-dots i:nth-child(2){animation-delay:.16s}
    #app-startup .startup-dots i:nth-child(3){animation-delay:.32s}
    #app-startup [data-startup-message]{margin:0;max-width:32ch;font-size:13px;color:#577067}
    #app-startup button{margin-top:18px;padding:11px 24px;border:0;border-radius:999px;background:#174b3e;color:white;font:inherit;cursor:pointer}
    #app-startup button:focus-visible{outline:3px solid #b29048;outline-offset:4px}
    #app-startup[data-state="error"] .startup-dots{visibility:hidden}
    #app-startup[data-state="error"] .startup-art{animation:none}
    @keyframes startup-float{50%{transform:translateY(-6px)}}
    @keyframes startup-pulse{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1.1)}}
    @media(prefers-reduced-motion:reduce){#app-startup .startup-art,#app-startup .startup-dots i{animation:none}#app-startup .startup-dots i{opacity:.65}}
    @media(max-height:480px){#app-startup .startup-art{width:160px}#app-startup strong{font-size:28px}#app-startup .startup-tagline{margin-bottom:14px}}
  </style>
